<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 280px; font-family: system-ui, -apple-system, sans-serif; padding: 16px; margin: 0; background: #fff; color: #1c1e21; }
    h2 { margin: 0 0 16px 0; font-size: 18px; text-align: center; }
    .toggle { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #1877F2; }
    input:checked + .slider:before { transform: translateX(18px); }
  </style>
</head>
<body>
  <h2>Unseen (Clean)</h2>
  
  <div class="toggle">
    <span>Anonymous Story viewing</span>
    <label class="switch"><input type="checkbox" id="DISABLE_STORIES_SEEN"><span class="slider"></span></label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
