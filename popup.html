<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1c1e21;
      margin: 0;
    }
    h2 {
      margin: 0 0 20px 0;
      font-size: 18px;
      text-align: center;
      font-weight: 600;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .label {
      font-size: 14px;
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #1877F2;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .status {
      text-align: center;
      font-size: 12px;
      color: #65676B;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>👻 Stories Unseen</h2>
  
  <div class="toggle-row">
    <span class="label">Anonymous Viewing</span>
    <label class="switch">
      <input type="checkbox" id="enableToggle">
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="status" id="statusText">Status: Active</div>
  
  <script src="popup.js"></script>
</body>
</html>
