name: Release Extension

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read current version
        id: current
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Check whether version changed
        id: changed
        run: |
          CURRENT="${{ steps.current.outputs.version }}"

          PREVIOUS=$(git show HEAD^:manifest.json 2>/dev/null \
            | node -e "
                let s='';
                process.stdin.on('data',d=>s+=d);
                process.stdin.on('end',()=> {
                  try {
                    console.log(JSON.parse(s).version);
                  } catch {
                    console.log('');
                  }
                });
              ")

          echo "Previous version: $PREVIOUS"
          echo "Current version:  $CURRENT"

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if version did not change
        if: steps.changed.outputs.changed != 'true'
        run: |
          echo "Version did not change. Nothing to release."
          exit 0

      - name: Build ZIP
        if: steps.changed.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.current.outputs.version }}"

          mkdir -p dist

          zip -r \
            "dist/UNSEE-Facebook-v${VERSION}.zip" \
            . \
            -x ".git/*" \
               ".github/*" \
               "dist/*"

      - name: Create GitHub Release
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          ZIP="dist/UNSEE-Facebook-v${VERSION}.zip"

          gh release create "v${VERSION}" \
            "$ZIP" \
            --title "UNSEE-Facebook v${VERSION}" \
            --generate-notes
